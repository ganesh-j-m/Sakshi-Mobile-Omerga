# Nginx reverse proxy with HTTPS (use certbot: `certbot --nginx -d your-domain.in -d www.your-domain.in`)
server {
    listen 80;
    server_name your-domain.in www.your-domain.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.in www.your-domain.in;

    ssl_certificate     /etc/letsencrypt/live/your-domain.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 60m;   # up to 10 images × 5 MB per upload request
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
